<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détails - MaisonSeason</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <i class="fas fa-home"></i> MaisonSeason
      </a>
      <div class="nav-links">
        <a href="index.html">Accueil</a>
        <a href="properties.html">Annonces</a>
        <a href="dashboard.html">Espace Hôte</a>
        <button class="btn-auth" onclick="openModal('loginModal')">Connexion</button>
      </div>
    </div>
  </nav>

  <div class="property-detail" id="propertyDetail">
    <!-- Rempli dynamiquement -->
  </div>

  <!-- Modal Réservation -->
  <div class="modal" id="bookingModal">
    <div class="modal-content modal-large">
      <span class="modal-close" onclick="closeModal('bookingModal')">&times;</span>
      <h2>Confirmer votre réservation</h2>
      <div id="bookingSummary"></div>
      <form id="bookingForm" onsubmit="confirmBooking(event)">
        <div class="form-group">
          <label>Demandes spéciales</label>
          <textarea id="specialRequests" rows="3" placeholder="Arrivée tardive, lit bébé..."></textarea>
        </div>
        <div class="booking-total" id="bookingTotal"></div>
        <button type="submit" class="btn btn-primary btn-full">Confirmer la réservation</button>
      </form>
    </div>
  </div>

  <!-- Modal Connexion -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeModal('loginModal')">&times;</span>
      <h2>Connexion</h2>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group"><label for="loginEmail">Email</label><input type="email" id="loginEmail" required></div>
        <div class="form-group"><label for="loginPassword">Mot de passe</label><input type="password" id="loginPassword" required></div>
        <button type="submit" class="btn btn-primary btn-full">Se connecter</button>
      </form>
      <p class="text-center mt-2">Pas encore de compte ? <a href="#" onclick="switchModal('loginModal', 'registerModal')">Inscrivez-vous</a></p>
    </div>
  </div>

  <!-- Modal Inscription -->
  <div class="modal" id="registerModal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeModal('registerModal')">&times;</span>
      <h2>Inscription</h2>
      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-row">
          <div class="form-group"><label for="regFirstName">Prénom</label><input type="text" id="regFirstName" required></div>
          <div class="form-group"><label for="regLastName">Nom</label><input type="text" id="regLastName" required></div>
        </div>
        <div class="form-group"><label for="regEmail">Email</label><input type="email" id="regEmail" required></div>
        <div class="form-group"><label for="regPhone">Téléphone</label><input type="tel" id="regPhone"></div>
        <div class="form-group"><label for="regPassword">Mot de passe</label><input type="password" id="regPassword" required minlength="6"></div>
        <div class="form-group"><label for="regRole">Je suis :</label><select id="regRole"><option value="guest">Voyageur</option><option value="host">Propriétaire</option></select></div>
        <button type="submit" class="btn btn-primary btn-full">S'inscrire</button>
      </form>
      <p class="text-center mt-2">Déjà un compte ? <a href="#" onclick="switchModal('registerModal', 'loginModal')">Connectez-vous</a></p>
    </div>
  </div>

  <!-- Modal Menu Utilisateur -->
  <div class="modal" id="userMenuModal">
    <div class="modal-content" style="max-width:350px">
      <span class="modal-close" onclick="closeModal('userMenuModal')">&times;</span>
      <h2>Mon compte</h2>
      <a href="dashboard.html" class="btn btn-primary btn-full" style="margin-bottom:10px;text-align:center;text-decoration:none;display:block;padding:12px;"><i class="fas fa-tachometer-alt"></i> Espace Propriétaire</a>
      <button class="btn btn-full" onclick="handleLogout()" style="width:100%;padding:12px;background:#ef4444;color:white;border:none;border-radius:8px;cursor:pointer;font-size:1rem;"><i class="fas fa-sign-out-alt"></i> Déconnexion</button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 MaisonSeason. Tous droits réservés.</p>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get('id'));
      if (id) {
        displayPropertyDetail(id);
      } else {
        window.location.href = 'properties.html';
      }
    });
  </script>
</body>
</html>
